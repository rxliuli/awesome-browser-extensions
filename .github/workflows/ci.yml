name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly build/README-sync validation.
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: README is in sync with data
        run: |
          pnpm build
          git diff --exit-code README.md
