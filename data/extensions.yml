# Data source for README.md — edit this file, then run `pnpm build`.
#
# Schema per extension:
#   name:        display name (required)
#   homepage:    official site; the entry name links here (falls back to source, then first store)
#   description: one or two sentences; include a current-status note when the obvious
#                choice has changed (acquisitions, MV3 casualties, closed-source caveats)
#   source:      public source repository — its presence marks the entry as open source
#   stores:      per-browser install links; omit a browser if the extension isn't available there
#     chrome / firefox / safari / edge

- category: Ad Blocking & Privacy
  extensions:
    - name: uBlock Origin Lite
      homepage: https://github.com/uBlockOrigin/uBOL-home
      description: >-
        Permission-less, MV3-native content blocker from the author of uBlock
        Origin. The recommended way to block ads on Chrome and Edge since
        Manifest V3 retired the full version there.
      source: https://github.com/uBlockOrigin/uBOL-home
      stores:
        chrome: https://chromewebstore.google.com/detail/ublock-origin-lite/ddkjiahejlhfcafbddmgiahcphecmpfh
        edge: https://microsoftedge.microsoft.com/addons/detail/ublock-origin-lite/cimighlppcgcoapaliogpjjdehbnofhn
    - name: uBlock Origin
      homepage: https://github.com/gorhill/uBlock
      description: >-
        The gold-standard wide-spectrum content blocker. No longer works on
        Chrome after the Manifest V2 shutdown — use uBlock Origin Lite there;
        on Firefox it still runs at full power.
      source: https://github.com/gorhill/uBlock
      stores:
        firefox: https://addons.mozilla.org/firefox/addon/ublock-origin/
    - name: Privacy Badger
      homepage: https://privacybadger.org/
      description: >-
        Tracker blocker from the EFF that learns to block invisible trackers
        as you browse. A trustworthy complement to an ad blocker rather than a
        replacement for one.
      source: https://github.com/EFForg/privacybadger
      stores:
        chrome: https://chromewebstore.google.com/detail/privacy-badger/pkehgijcmpdhfbdbbnkijodmdjhbjlgp
        firefox: https://addons.mozilla.org/firefox/addon/privacy-badger17/
        edge: https://microsoftedge.microsoft.com/addons/detail/privacy-badger/mkejgcgkdlddbggjhhflekkondicpnop
    - name: uBlacklist
      homepage: https://ublacklist.github.io/
      description: >-
        Blocks the sites you choose from ever appearing in Google search
        results, with subscribable community rulesets. Increasingly essential
        as SEO spam and machine-generated content flood the results page.
      source: https://github.com/iorate/ublacklist
      stores:
        chrome: https://chromewebstore.google.com/detail/ublacklist/pncfbmialoiaghdehhbnbhkkgmjanfhe
        firefox: https://addons.mozilla.org/firefox/addon/ublacklist/
        safari: https://apps.apple.com/app/ublacklist-for-safari/id1547912640

- category: Passwords & Security
  extensions:
    - name: Bitwarden
      homepage: https://bitwarden.com/
      description: >-
        Open-source password manager with a solid free tier and clients on
        every platform. The default recommendation since the LastPass
        breaches made "closed source + your vault" a hard sell.
      source: https://github.com/bitwarden/clients
      stores:
        chrome: https://chromewebstore.google.com/detail/bitwarden-password-manage/nngceckbapebfimnlniiiahkandclblb
        firefox: https://addons.mozilla.org/firefox/addon/bitwarden-password-manager/
        safari: https://apps.apple.com/app/bitwarden/id1352778147
        edge: https://microsoftedge.microsoft.com/addons/detail/bitwarden-password-manage/jbkfoedolllekgbhcbcoahefnbanhhlh
    - name: KeePassXC-Browser
      homepage: https://keepassxc.org/
      description: >-
        Companion extension for the KeePassXC desktop app. The right choice if
        you want your password database as a local file instead of in anyone's
        cloud.
      source: https://github.com/keepassxreboot/keepassxc-browser
      stores:
        chrome: https://chromewebstore.google.com/detail/keepassxc-browser/oboonakemofpalcgghocfoadofidjkkk
        firefox: https://addons.mozilla.org/firefox/addon/keepassxc-browser/
        edge: https://microsoftedge.microsoft.com/addons/detail/keepassxcbrowser/pdffhmdngciaglkoonimfcmckehcpafo
    - name: Authenticator
      homepage: https://authenticator.cc/
      description: >-
        Generates two-factor authentication codes in the browser; the de facto
        standard open-source TOTP extension. Convenient, but know the
        trade-off — keeping codes in the same browser as your passwords
        weakens the isolation a second factor is meant to provide.
      source: https://github.com/Authenticator-Extension/Authenticator
      stores:
        chrome: https://chromewebstore.google.com/detail/authenticator/bhghoamapcdpbohphigoooaddinpkbai
        firefox: https://addons.mozilla.org/firefox/addon/auth-helper/
        edge: https://microsoftedge.microsoft.com/addons/detail/authenticator-2fa-client/ocglkepbibnalbgmbachknglpdipeoio

- category: Customization
  extensions:
    - name: Dark Reader
      homepage: https://darkreader.org/
      description: >-
        Generates a dark theme for every website, with per-site brightness,
        contrast and sepia tuning. Free on Chrome, Firefox and Edge; a paid
        app on Safari.
      source: https://github.com/darkreader/darkreader
      stores:
        chrome: https://chromewebstore.google.com/detail/dark-reader/eimadpbcbfnmbkopoojfekhnkhdbieeh
        firefox: https://addons.mozilla.org/firefox/addon/darkreader/
        safari: https://apps.apple.com/app/dark-reader-for-safari/id1438243180
        edge: https://microsoftedge.microsoft.com/addons/detail/dark-reader/ifoakfbpdcdoeenechcleahebpibofpc
    - name: Stylus
      description: >-
        Apply custom CSS to any website, with an editor and access to the
        UserStyles community. The trustworthy successor to Stylish, which was
        caught collecting browsing history after an acquisition.
      source: https://github.com/openstyles/stylus
      stores:
        chrome: https://chromewebstore.google.com/detail/stylus/clngdbkpkpeebahjckkjfobafhncgmne
        firefox: https://addons.mozilla.org/firefox/addon/styl-us/
    - name: Violentmonkey
      homepage: https://violentmonkey.github.io/
      description: >-
        Userscript manager for running community scripts from Greasy Fork and
        friends. Fully open source, which is why it edges out the more famous
        but closed-source Tampermonkey as the default pick.
      source: https://github.com/violentmonkey/violentmonkey
      stores:
        chrome: https://chromewebstore.google.com/detail/violentmonkey/jinjaccalgkegednnccohejagnlnfdag
        firefox: https://addons.mozilla.org/firefox/addon/violentmonkey/
        edge: https://microsoftedge.microsoft.com/addons/detail/violentmonkey/eeagobfjdenkkddmbclomhiblgggliao
    - name: Tampermonkey
      homepage: https://www.tampermonkey.net/
      description: >-
        The most widely used userscript manager, with the broadest browser
        coverage including Safari. Mature and reliable, but closed source —
        prefer Violentmonkey if that matters to you.
      stores:
        chrome: https://chromewebstore.google.com/detail/tampermonkey/dhdgffkkebhmkfjojejmpbldmpobfkfo
        firefox: https://addons.mozilla.org/firefox/addon/tampermonkey/
        safari: https://apps.apple.com/app/tampermonkey/id1482490089
        edge: https://microsoftedge.microsoft.com/addons/detail/tampermonkey/iikmkjmpaadaobahmlepeloendndfphd

- category: Productivity
  extensions:
    - name: SingleFile
      description: >-
        Saves a complete web page — styles, images, fonts — into a single
        self-contained HTML file. The best answer to "this page might not
        exist next year."
      source: https://github.com/gildas-lormeau/SingleFile
      stores:
        chrome: https://chromewebstore.google.com/detail/singlefile/mpiodijhokgodhhofbcjdecpffjipkle
        firefox: https://addons.mozilla.org/firefox/addon/single-file/
        safari: https://apps.apple.com/app/singlefile-for-safari/id6444322545
        edge: https://microsoftedge.microsoft.com/addons/detail/singlefile/efnbkdcfmcmnhlkaijjjmhjjgladedno
    - name: Redirector
      homepage: https://store.rxliuli.com/extensions/redirector/
      description: >-
        Automatically rewrites URLs that match your rules, sending links to
        their canonical, mirrored or preferred destinations before the page
        loads. Actively maintained, and one of the few redirect extensions
        available on all four major browsers including Safari.
      source: https://github.com/rxliuli/redirector
      stores:
        chrome: https://chromewebstore.google.com/detail/redirector/lioaeidejmlpffbndjhaameocfldlhin
        firefox: https://addons.mozilla.org/firefox/addon/redirector-url/
        safari: https://apps.apple.com/app/url-redirector/id6743197230
        edge: https://microsoftedge.microsoft.com/addons/detail/redirector/jhdjcofnjfeljeekjklhgfmfocfgibmm

- category: Media
  extensions:
    - name: SponsorBlock
      homepage: https://sponsor.ajay.app/
      description: >-
        Skips sponsor segments, intros and self-promotion in YouTube videos,
        powered by crowdsourced timestamps.
      source: https://github.com/ajayyy/SponsorBlock
      stores:
        chrome: https://chromewebstore.google.com/detail/sponsorblock-for-youtube/mnjggcdmjocbbbhaepdhchncahnbgone
        firefox: https://addons.mozilla.org/firefox/addon/sponsorblock/
        edge: https://microsoftedge.microsoft.com/addons/detail/sponsorblock-for-youtube/hkbdddpiemdeibjoknnofjnhjfkdbpbc
    - name: Enhancer for YouTube
      homepage: https://www.mrfdev.com/enhancer-for-youtube
      description: >-
        Fine-grained control over the YouTube player — playback speed and
        volume steps, cinema mode, forced quality, themes and dozens of other
        tweaks. Closed source, but a long-standing one-developer project with
        a solid track record.
      stores:
        chrome: https://chromewebstore.google.com/detail/enhancer-for-youtube/ponfpcnoihfmfllpaingbgckeeldkhle
        firefox: https://addons.mozilla.org/firefox/addon/enhancer-for-youtube/
        edge: https://microsoftedge.microsoft.com/addons/detail/enhancer-for-youtube%E2%84%A2/dlgfaleeejmphhnemjgiaekdbonkagkd

- category: Developer Tools
  extensions:
    - name: React Developer Tools
      homepage: https://react.dev/learn/react-developer-tools
      description: >-
        Official React DevTools panel for inspecting component trees, props,
        state and render performance.
      source: https://github.com/facebook/react/tree/main/packages/react-devtools-extensions
      stores:
        chrome: https://chromewebstore.google.com/detail/react-developer-tools/fmkadmapgofadopljbjfkapdkoienihi
        firefox: https://addons.mozilla.org/firefox/addon/react-devtools/
        edge: https://microsoftedge.microsoft.com/addons/detail/react-developer-tools/gpphkfbcpidddadnkolkpfckpihlkkil
    - name: Vue.js devtools
      homepage: https://devtools.vuejs.org/
      description: >-
        Official Vue DevTools panel for inspecting components, Pinia stores,
        router state and timeline events.
      source: https://github.com/vuejs/devtools
      stores:
        chrome: https://chromewebstore.google.com/detail/vuejs-devtools/nhdogjmejiglipccpnnnanhbledajbpd
        firefox: https://addons.mozilla.org/firefox/addon/vue-js-devtools/
        edge: https://microsoftedge.microsoft.com/addons/detail/vuejs-devtools/olofadcdnkkjdfgjcmjaadnlehnnihnl
    - name: Refined GitHub
      description: >-
        Dozens of small quality-of-life improvements to the GitHub UI, from
        whitespace toggles to smarter default views. Absorbed most of what the
        old single-purpose GitHub extensions used to do.
      source: https://github.com/refined-github/refined-github
      stores:
        chrome: https://chromewebstore.google.com/detail/refined-github/hlepfoohegkhhmjieoechaddaejaokhf
        firefox: https://addons.mozilla.org/firefox/addon/refined-github-/
        safari: https://apps.apple.com/app/refined-github/id1519867270
